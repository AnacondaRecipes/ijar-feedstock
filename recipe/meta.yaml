{% set name = "ijar" %}
{% set version = "9.3.1" %}

{% set base_url = "https://github.com/bazelbuild/bazel/releases/download" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: {{ base_url }}/{{ version }}/bazel-{{ version }}-dist.zip
    sha256: 6169ed42d506f3466fac899cc0a1ffa05718dece512cde9c2cd5eebf4e9ff4c3
  - fn: bazel
    url: {{ base_url }}/{{ version }}/bazel_nojdk-{{ version }}-linux-x86_64  # [build_platform == "linux-64"]
    sha256: 444c309e4d3a3007ef39debdf483e4399912a7d0073f52dfb56352a15a727dd8  # [build_platform == "linux-64"]
    url: {{ base_url }}/{{ version }}/bazel_nojdk-{{ version }}-linux-arm64   # [build_platform == "linux-aarch64"]
    sha256: b9dfab19c2f67d78f14aae8c6f250d40040177263c64a8cdf5008cd8e3a7db73  # [build_platform == "linux-aarch64"]
    url: {{ base_url }}/{{ version }}/bazel_nojdk-{{ version }}-darwin-arm64  # [build_platform == "osx-arm64"]
    sha256: 68ccda4efe08b9f25b4cf480dadf7ffec428deaac0fe4868936c6085a80089dd  # [build_platform == "osx-arm64"]

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - bazel-toolchain >=0.5.0
    - openjdk
    - patchelf  # [linux]
    - sed

test:
  commands:
    - test -f $PREFIX/bin/ijar
    - test -f $PREFIX/bin/zipper

about:
  home: https://github.com/bazelbuild/bazel/tree/master/third_party/ijar
  license: Apache-2.0
  license_family: Apache
  license_file: third_party/ijar/LICENSE
  summary: A tool for generating interface .jars from normal .jars
  description: A tool for generating interface .jars from normal .jars
  dev_url: https://github.com/bazelbuild/bazel/tree/master/third_party/ijar
  doc_url: https://github.com/bazelbuild/bazel/tree/master/third_party/ijar

extra:
  skip-lints:
    - missing_documentation
    - missing_hash
    - missing_source
  recipe-maintainers:
    - xhochy
    - conda-forge/bazel
